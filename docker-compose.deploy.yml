services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naradmuni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-naradmuni}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-naradmuni} -d ${POSTGRES_DB:-naradmuni}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app

  api:
    image: ghcr.io/${GHCR_OWNER}/naradmuni-api:${API_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-naradmuni}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-naradmuni}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks:
      - app

  web:
    image: ghcr.io/${GHCR_OWNER}/naradmuni-web:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - app

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      LOCAL_DATABASE_URL: postgresql://${POSTGRES_USER:-naradmuni}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-naradmuni}
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_RETRIES: ${BACKUP_RETRIES:-5}
      BACKUP_RETRY_DELAY_SECONDS: ${BACKUP_RETRY_DELAY_SECONDS:-60}
      BACKUP_HOURLY_RETRY_SECONDS: ${BACKUP_HOURLY_RETRY_SECONDS:-3600}
    volumes:
      - ./docker/backup-to-neon.sh:/usr/local/bin/backup-to-neon.sh:ro
      - ./docker/backup-entrypoint.sh:/usr/local/bin/backup-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/backup-entrypoint.sh"]
    networks:
      - app

networks:
  app:

volumes:
  pgdata:
