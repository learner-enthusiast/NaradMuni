services:
  api:
    image: ghcr.io/${GHCR_OWNER}/naradmuni-api:${API_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      NODE_ENV: production
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks:
      - app

  web:
    image: ghcr.io/${GHCR_OWNER}/naradmuni-web:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - app

networks:
  app:
